name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build worker
        run: npm run build

      - name: Collect release facts
        id: facts
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "size=$(( $(stat -c%s dist/worker.js) / 1024 )) KB" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum dist/worker.js | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.facts.outputs.tag }}
          name: Tabora ${{ steps.facts.outputs.tag }}
          files: dist/worker.js
          generate_release_notes: true
          body: |
            ## Install

            **Cloudflare dashboard** — create a Worker, paste the contents of
            `worker.js` from the assets below, then bind a D1 database as `DB`
            and set `ADMIN_PASSWORD` and `SECURE_PATH`.

            **Wrangler**

            ```bash
            git clone https://github.com/Taboraex/tabora-panel.git
            cd tabora && npm install
            npx wrangler d1 create tabora-db   # copy the id into wrangler.toml
            npm run build && npx wrangler deploy
            ```

            Full instructions are in the [README](https://github.com/Taboraex/tabora-panel#quick-start).

            ## Artifact

            | | |
            | --- | --- |
            | Bundle | `worker.js` |
            | Size | ${{ steps.facts.outputs.size }} |
            | SHA-256 | `${{ steps.facts.outputs.sha256 }}` |

            > After deploying, sign in and change the default password immediately.
