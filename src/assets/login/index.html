<style>/* CSS_PLACEHOLDER */</style>
</head>
<body>
<div class="aurora"></div>
<div class="hex"></div>
<div class="glow"></div>
<div class="noise"></div>
<button class="lang-toggle" id="langBtn" type="button">EN</button>
<main class="shell">
  <form id="form" class="card" autocomplete="off">
    <div class="brand">
      <svg viewBox="0 0 64 64" class="logo" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#6366f1"/>
        </linearGradient></defs>
        <path d="M32 5 55.38 18.5v27L32 59 8.62 45.5v-27Z" fill="url(#lg)" opacity=".12"/>
        <path d="M32 5 55.38 18.5v27L32 59 8.62 45.5v-27Z" fill="none" stroke="url(#lg)" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M20 23h24M32 23v21" stroke="url(#lg)" stroke-width="5" stroke-linecap="round"/>
        <circle cx="32" cy="5" r="4.2" fill="url(#lg)"/>
        <circle cx="55.38" cy="45.5" r="4.2" fill="url(#lg)"/>
        <circle cx="8.62" cy="45.5" r="4.2" fill="url(#lg)"/>
      </svg>
      <h1>{{PROJECT}}</h1>
      <p class="sub" id="subLine">Sign in to continue</p>
    </div>

    <label class="field">
      <span id="passLabel">Password</span>
      <div class="input-wrap">
        <input id="password" type="password" required autofocus placeholder="••••••••">
        <button type="button" id="toggle" class="ghost-btn" aria-label="Show password">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7Zm0 11.5A4.5 4.5 0 1 1 16.5 12 4.5 4.5 0 0 1 12 16.5Zm0-7A2.5 2.5 0 1 0 14.5 12 2.5 2.5 0 0 0 12 9.5Z"/></svg>
        </button>
      </div>
    </label>

    <button type="submit" id="submit" class="primary">
      <span class="label">Sign in</span>
      <span class="spinner" hidden></span>
    </button>

    <p id="error" class="error" role="alert" hidden></p>
    <p class="version">v{{VERSION}}</p>
  </form>
</main>

<script>window.TABORA_BASE = "{{BASE}}";</script>
<script>/* JS_PLACEHOLDER */</script>
</body>
</html>
