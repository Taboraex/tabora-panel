<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050814">
<title>{{PROJECT}}</title>
  <link rel="icon" href="FAVICON_SRC">
<style>/* CSS_PLACEHOLDER */</style>
</head>
<body>
<div class="aurora"></div>
<div class="hex"></div>
<div class="glow"></div>
<div class="noise"></div>
<button class="lang-toggle" id="langBtn" type="button">EN</button>
<main class="shell">
  <form id="form" class="card" autocomplete="off">
    <div class="brand">
      <img class="logo" src="LOGO_BADGE_SRC" width="156" height="156" alt="">
      <h1>{{PROJECT}}</h1>
      <p class="sub" id="subLine">Sign in to continue</p>
    </div>

    <label class="field">
      <span id="passLabel">Password</span>
      <div class="input-wrap">
        <input id="password" type="password" required autofocus placeholder="••••••••">
        <button type="button" id="toggle" class="ghost-btn" aria-label="Show password">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7Zm0 11.5A4.5 4.5 0 1 1 16.5 12 4.5 4.5 0 0 1 12 16.5Zm0-7A2.5 2.5 0 1 0 14.5 12 2.5 2.5 0 0 0 12 9.5Z"/></svg>
        </button>
      </div>
    </label>

    <button type="submit" id="submit" class="primary">
      <span class="label">Sign in</span>
      <span class="spinner" hidden></span>
    </button>

    <p id="error" class="error" role="alert" hidden></p>
    <p class="version">v{{VERSION}}</p>
  </form>
</main>

<script>window.TABORA_BASE = "{{BASE}}";</script>
<script>/* JS_PLACEHOLDER */</script>
</body>
</html>
