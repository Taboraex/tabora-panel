<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{PROJECT}}</title>
<style>/* CSS_PLACEHOLDER */</style>
</head>
<body>
<main class="shell">
  <form id="form" class="card" autocomplete="off">
    <div class="brand">
      <svg viewBox="0 0 48 48" class="logo" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#6366f1"/>
          </linearGradient>
        </defs>
        <path fill="url(#g)" d="M24 3 7 11v12c0 10.5 7.2 19.6 17 22 9.8-2.4 17-11.5 17-22V11L24 3Z"/>
        <path fill="#0b1120" opacity=".85" d="M24 14.5 15 18.7v6.1c0 5.3 3.8 10 9 11.4 5.2-1.4 9-6.1 9-11.4v-6.1L24 14.5Z"/>
        <circle cx="24" cy="24" r="3.4" fill="#38bdf8"/>
      </svg>
      <h1>{{PROJECT}}</h1>
      <p class="sub">Sign in to continue</p>
    </div>

    <label class="field">
      <span>Password</span>
      <div class="input-wrap">
        <input id="password" type="password" required autofocus placeholder="••••••••">
        <button type="button" id="toggle" class="ghost-btn" aria-label="Show password">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7Zm0 11.5A4.5 4.5 0 1 1 16.5 12 4.5 4.5 0 0 1 12 16.5Zm0-7A2.5 2.5 0 1 0 14.5 12 2.5 2.5 0 0 0 12 9.5Z"/></svg>
        </button>
      </div>
    </label>

    <button type="submit" id="submit" class="primary">
      <span class="label">Sign in</span>
      <span class="spinner" hidden></span>
    </button>

    <p id="error" class="error" role="alert" hidden></p>
    <p class="version">v{{VERSION}}</p>
  </form>
</main>

<script>window.TABORA_BASE = "{{BASE}}";</script>
<script>/* JS_PLACEHOLDER */</script>
</body>
</html>
