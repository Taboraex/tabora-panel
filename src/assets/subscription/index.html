<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{NAME}} — {{PROJECT}}</title>
<style>/* CSS_PLACEHOLDER */</style>
</head>
<body>
<main class="wrap">

  <header class="head">
    <svg viewBox="0 0 48 48" class="logo" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#6366f1"/>
      </linearGradient></defs>
      <path fill="url(#g)" d="M24 3 7 11v12c0 10.5 7.2 19.6 17 22 9.8-2.4 17-11.5 17-22V11L24 3Z"/>
      <path fill="#0b1120" opacity=".85" d="M24 14.5 15 18.7v6.1c0 5.3 3.8 10 9 11.4 5.2-1.4 9-6.1 9-11.4v-6.1L24 14.5Z"/>
      <circle cx="24" cy="24" r="3.4" fill="#38bdf8"/>
    </svg>
    <h1>{{NAME}}</h1>
    <span class="pill" id="status">{{STATUS}}</span>
  </header>

  <section class="card">
    <div class="usage-head">
      <span class="usage-label">Traffic</span>
      <span class="usage-value"><strong>{{USED}}</strong> / {{LIMIT}}</span>
    </div>
    <div class="bar"><i id="bar" style="width:{{PERCENT}}%"></i></div>
    <div class="usage-foot">
      <span id="pct">{{PERCENT}}% used</span>
      <span>Expires: {{EXPIRY}}</span>
    </div>
  </section>

  <section class="card">
    <h2>Subscription links</h2>
    <div class="link" data-url="{{SUB_URL}}">
      <span class="link-name">Auto</span>
      <code>{{SUB_URL}}</code>
      <button class="btn" data-copy="{{SUB_URL}}">Copy</button>
    </div>
    <div class="link" data-url="{{SUB_CLASH}}">
      <span class="link-name">Clash</span>
      <code>{{SUB_CLASH}}</code>
      <button class="btn" data-copy="{{SUB_CLASH}}">Copy</button>
    </div>
    <div class="link" data-url="{{SUB_SINGBOX}}">
      <span class="link-name">Sing-box</span>
      <code>{{SUB_SINGBOX}}</code>
      <button class="btn" data-copy="{{SUB_SINGBOX}}">Copy</button>
    </div>
  </section>

  <section class="card center">
    <h2>Scan to import</h2>
    <canvas id="qr" width="230" height="230"></canvas>
    <p class="hint">Open your client and scan, or copy a link above.</p>
  </section>

  <footer class="foot">{{PROJECT}} · v{{VERSION}}</footer>
</main>

<div id="toast" class="toast" hidden></div>
<script>/* JS_PLACEHOLDER */</script>
</body>
</html>
